name: Build FC27 game-free unsigned runtime

on:
  push:
    branches: [fc27-ios-20261031]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          path: payload
      - uses: actions/checkout@v4
        with:
          repository: xinerqu/ns2ios-shell
          ref: d3c0c601b46f8d51a3a15bf09ff74ecb4581aefd
          path: fork
      - uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          ref: 6d880d237a7684365ca88236e5a5ff34921adf7d
          path: source
      - name: Assemble the complete pinned upstream and shell overlay
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            p="${line#+}"; p="${p%%#*}"; p="$(echo "$p" | tr -d '[:space:]')"
            [ -n "$p" ] || continue
            mkdir -p "source/$(dirname "$p")"
            cp -a "fork/$p" "source/$p"
          done < <(grep -E '^\+' fork/.shell-overlay.txt)
          for patch in "$GITHUB_WORKSPACE"/fork/.shell-patches/*.patch; do
            git -C source apply --whitespace=nowarn "$patch"
          done
      - name: Apply only the reviewed runtime source
        shell: bash
        run: |
          set -euo pipefail
          git -C source apply --check "$GITHUB_WORKSPACE/payload/fc27-cloud/runtime.patch"
          git -C source apply "$GITHUB_WORKSPACE/payload/fc27-cloud/runtime.patch"
          cp -R payload/fc27-cloud/overlay/. source/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('source/dm/ios/tools/shell_build.sh')
          s = p.read_text()
          first = s.index('# The memory limit is part of the package')
          last = s.index('n=$(otool -l', first)
          s = s[:first] + '# This workbench delivers unsigned runtime inputs; the user signs with official SideStore.\n' + s[last:]
          assert 'codesign --force' not in s
          p.write_text(s)
          PY
          clang -std=c11 -Wall -Wextra -Werror -Isource/dm/host payload/fc27-cloud/t_shell_module_name.c -o "$RUNNER_TEMP/test-shell"
          "$RUNNER_TEMP/test-shell"
          clang -std=c11 -Wall -Wextra -Werror -Isource/dm/host source/dm/host/tests/t_native_display.c -lm -o "$RUNNER_TEMP/test-display"
          "$RUNNER_TEMP/test-display"
      - name: Verify shader options and bounded preparation
        working-directory: source
        run: |
          python3 -m unittest dm.tools.tests.test_msl_source_options dm.tools.tests.test_shader_prep_policy dm.tools.tests.test_nvn_rec_blit_options -v
      - name: Verify exact-build frame limits and native-display contract
        working-directory: source
        run: |
          python3 dm/games/game.py header 0000000000000000 "$RUNNER_TEMP/game_profile.h"
          clang -std=gnu11 -Wall -Wextra -Wno-missing-field-initializers -I "$RUNNER_TEMP" -I dm/host dm/host/tests/t_fpslock.c -o "$RUNNER_TEMP/test-fps" -lm
          "$RUNNER_TEMP/test-fps"
          clang -std=c11 -Wall -Wextra -Werror -I dm/host dm/host/tests/t_fc27_native_display.c -o "$RUNNER_TEMP/test-fc27-display"
          "$RUNNER_TEMP/test-fc27-display"
      - name: Install ordinary build dependencies
        run: |
          brew install xcodegen
          python3 -m venv "$RUNNER_TEMP/font-venv"
          "$RUNNER_TEMP/font-venv/bin/python" -m pip install fonttools
      - name: Build the game-free shell
        working-directory: source
        env:
          DM_ROOT: ${{ runner.temp }}/fc27-runtime
          FONT_PY: ${{ runner.temp }}/font-venv/bin/python
        run: bash dm/ios/tools/shell_build.sh
      - name: Verify compiled identity and attach provenance
        env:
          PAYLOAD_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          shell = root / 'fc27-runtime/build/shell/nxnative-shell-build-input.zip'
          with zipfile.ZipFile(shell, 'a') as z:
              host = z.read('Payload/DmIOS.app/DmIOS')
              assert b'shell NRO table v1' in host
              assert b'relaxed-invariant-v1' in host
              assert b'native-display-v1' in host
              assert b'fc27-native-display-v1' in host
              assert b'fb81983aa1cc3a2e97402497e2ca6528' in host
              assert not any('romfs' in n.lower() or 'Guest.framework' in n for n in z.namelist())
              stamp = {'payload_commit': os.environ['PAYLOAD_COMMIT'],
                       'base_source': 'd3c0c601b46f8d51a3a15bf09ff74ecb4581aefd',
                       'host_sha256': hashlib.sha256(host).hexdigest(),
                       'nro_layout': 'table-v1', 'shader_options': 'relaxed-invariant-v1',
                       'native_display': 'oe-resolution-v1 (opt-in, engine/device acceptance pending)',
                       'deferred_copy_options': 'depth-stencil-planes-v1',
                       'fc27_frame_regulator': 'exact-build-fb81983a-v1',
                       'fc27_native_engine': 'guarded-settings-v1 (opt-in; pending)',
                       'shader_preparation_workers_max': 2, 'device_acceptance': 'pending'}
              z.writestr('Payload/DmIOS.app/dm/fc27_runtime.json', json.dumps(stamp, indent=2))
          # Packaging reuses all unchanged game-independent fonts from v5.
          small = root / 'fc27-runtime/build/shell/fc27-small-runtime.zip'
          with zipfile.ZipFile(shell) as src, zipfile.ZipFile(small, 'w', compression=zipfile.ZIP_DEFLATED) as dst:
              for name in ('Payload/DmIOS.app/DmIOS', 'Payload/DmIOS.app/dm/fc27_runtime.json', 'Payload/DmIOS.app/dm/shell_info.txt'):
                  dst.writestr(name, src.read(name))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fc27-game-free-shell
          path: ${{ runner.temp }}/fc27-runtime/build/shell/nxnative-shell-build-input.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: fc27-small-runtime
          path: ${{ runner.temp }}/fc27-runtime/build/shell/fc27-small-runtime.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fc27-build-logs
          path: ${{ runner.temp }}/fc27-runtime/build/shell/*.log
          if-no-files-found: ignore
